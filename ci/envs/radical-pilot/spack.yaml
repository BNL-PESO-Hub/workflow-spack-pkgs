spack:
  view: ./view

  concretizer:
    unify: false

  config:
    install_tree:
      root: ./spack
      padded_length: 128

  packages:
    all:
      require: 'target=x86_64'

  mirrors:
    local-buildcache:
      url: oci://ghcr.io/bnl-peso-hub/workflow-spack-pkgs/spack-buildcache
      binary: true
      signed: false
      access_pair:
        id_variable: GITHUB_USER
        secret_variable: GITHUB_TOKEN

  specs:
    - python@3.12
    - py-radical-pilot
