name: spack-radical-pilot

on:
  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_dispatch
  workflow_dispatch:
    inputs:
      fresh:
        description: 'Create a fresh buildcache'
        type: boolean
        default: false
  # https://docs.github.com/en/rest/repos/repos#create-a-repository-dispatch-event
  repository_dispatch:
    types: [ ci-spack-rp-on-demand ]
  push:
    branches: [ main ]
    paths:
      - 'ci/envs/radical-pilot/**'
      - 'ci/tests/radical-pilot/**'

jobs:
  run:
    uses: ./.github/workflows/spack-base.yml
    with:
      tool_name: radical-pilot
      fresh: ${{ github.event_name == 'push' || inputs.fresh || false }}
    secrets: inherit
